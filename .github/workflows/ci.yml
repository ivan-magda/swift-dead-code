name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The Xcode that BuildTools/lint-versions.env pins, on the xcode-27 image (macos-26 stops
        # at Xcode 26.6), and Xcode 26.0, the first with Swift 6.2, which Package.swift declares.
        include:
          - xcode: pinned
            runner: xcode-27
          - xcode: "26.0"
            runner: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the Xcode version
        id: pins
        run: |
          source BuildTools/lint-versions.env
          xcode="${{ matrix.xcode }}"
          [[ "$xcode" != pinned ]] || xcode=$DEADCODE_XCODE_VERSION
          printf 'xcode=%s\n' "$xcode" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ steps.pins.outputs.xcode }}

      - name: Install Periphery and XcodeGen
        run: |
          source BuildTools/lint-versions.env
          archive="$RUNNER_TEMP/periphery.zip"
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/peripheryapp/periphery/releases/download/${DEADCODE_PERIPHERY_VERSION}/periphery-${DEADCODE_PERIPHERY_VERSION}.zip"
          printf '%s  %s\n' "$DEADCODE_PERIPHERY_SHA256" "$archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP/periphery"
          printf '%s\n' "$RUNNER_TEMP/periphery" >> "$GITHUB_PATH"
          brew install xcodegen

      - name: Restore the build
        uses: actions/cache@v6
        with:
          path: .build
          key: build-xcode-${{ steps.pins.outputs.xcode }}-${{ hashFiles('Package.resolved') }}

      - name: Build
        run: swift build --build-tests

      - name: Test
        # Without Periphery or XcodeGen some tests skip instead of failing, so a skip fails here.
        run: |
          swift test --skip-build 2>&1 | tee "$RUNNER_TEMP/test.log"
          if grep -q ' skipped' "$RUNNER_TEMP/test.log"; then
            echo "::error::Some tests were skipped: is Periphery or XcodeGen missing?"
            exit 1
          fi

      - name: Check this repository with the tool
        run: swift run swift-dead-code check

  lint:
    # swift-format comes with the pinned Xcode.
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the Xcode version
        id: pins
        run: |
          source BuildTools/lint-versions.env
          printf 'xcode=%s\n' "$DEADCODE_XCODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ steps.pins.outputs.xcode }}

      - name: Install SwiftLint
        run: |
          source BuildTools/lint-versions.env
          archive="$RUNNER_TEMP/swiftlint.zip"
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/realm/SwiftLint/releases/download/${DEADCODE_SWIFTLINT_VERSION}/portable_swiftlint.zip"
          printf '%s  %s\n' "$DEADCODE_SWIFTLINT_SHA256" "$archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP/swiftlint"
          printf '%s\n' "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Lint
        run: STRICT=1 scripts/lint.sh
