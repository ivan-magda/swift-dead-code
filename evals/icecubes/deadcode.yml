# IceCubes: an xcodeproj with extensions in synchronized folders and local packages added as
# folder references. IceCubesApp.xcconfig comes from IceCubesApp.xcconfig.template (README).
# The app ships for iOS, Mac Catalyst and visionOS; 36 files branch on Mac Catalyst and 84 on
# visionOS. iOS and Mac Catalyst are built and scanned together, so a declaration either uses
# stays. The visionOS build fails upstream with Xcode 27.1 ('glassEffect(_:in:)' is unavailable
# in visionOS, Packages/DesignSystem/.../CardBackgroundModifier.swift:10), so code only visionOS
# reads can still look unused: triage asks for #if branches.
project:
  kind: xcode
  path: IceCubesApp.xcodeproj
  schemes: [IceCubesApp]

builds:
  - name: ios
    destination: "generic/platform=iOS Simulator"
  - name: catalyst
    destination: "generic/platform=macOS,variant=Mac Catalyst"
