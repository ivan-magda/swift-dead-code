# Element X: a project generated by XcodeGen (project.yml; the generated project is committed)
# with local packages from Package.swift and compound-ios. The settings below carry over the
# project's own .periphery.yml, which swift-dead-code does not read.
project:
  kind: xcode
  path: ElementX.xcodeproj
  # Every scheme, so usage from each test bundle is visible (the project's .periphery.yml).
  schemes: [ElementX, UnitTests, PreviewTests, UITests, IntegrationTests, AccessibilityTests]
  destination: "generic/platform=iOS Simulator"

# Mocks the unit tests use, generated by Sourcery.
test_support: [MatrixRustSDKMocks]

# Not reported, still users of what they reference: generated code (SwiftGen, Sourcery),
# hand-written mocks with a deliberately broad surface, a payload schema whose fields exist to
# be encoded, and backports cleaned up with each OS drop.
exclude:
  - "**/Generated/**"
  - "**/Mocks/**"
  - "ElementX/Sources/Services/AppLock/LAContextMock.swift"
  - "ElementX/Sources/Services/Notification/Manager/APNSPayload.swift"
  - "ElementX/Sources/Other/SwiftUI/Backports.swift"

periphery:
  arguments:
    - --retain-swift-ui-previews
    # Protocol signatures are contracts (hooks, delegates).
    - --retain-unused-protocol-func-params
    # Compound's Inspector app and package tests are in no scheme here, so its findings are
    # unreliable.
    - --index-exclude
    - "compound-ios/**"
