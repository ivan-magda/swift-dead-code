# Element X: a project generated by XcodeGen (project.yml, the generated project is committed)
# with local packages from Package.swift and compound-ios.
project:
  kind: xcode
  path: ElementX.xcodeproj
  schemes: [ElementX]
  destination: "generic/platform=iOS Simulator"

# Mocks the unit tests use; generated by Sourcery into the app target's sources.
test_support: [MatrixRustSDKMocks]
