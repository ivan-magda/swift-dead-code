# Weekly dead-code analysis for a project that uses swift-dead-code, modeled on swift-claw's
# .github/workflows/dead-code.yml. Copy it to .github/workflows/dead-code.yml.
#
# The quick gate (`swift-dead-code check`) needs no build: run it in your lint job on every
# pull request. Unused declarations and imports need an indexed build, too slow for every pull
# request, so this runs weekly, on demand, and when the analysis configuration changes.
name: Dead code

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .deadcode.yml
      - .deadcode/**
      - .github/workflows/dead-code.yml

permissions:
  contents: read

concurrency:
  group: dead-code-${{ github.ref }}
  cancel-in-progress: true

env:
  PERIPHERY_VERSION: 3.8.0
  SWIFT_DEAD_CODE_VERSION: 0.1.0
  # The SHA-256 of swift-dead-code-<version>-macos.zip, from checksums.txt in the release.
  SWIFT_DEAD_CODE_SHA256: 354dd699d5e62012c75ade0ab3fda8038ca50879f551cc88c7bae767f2ec1e03

defaults:
  run:
    shell: bash

jobs:
  periphery:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Periphery
        run: |
          archive="$RUNNER_TEMP/periphery.zip"
          curl --fail --location --silent --show-error \
            "https://github.com/peripheryapp/periphery/releases/download/${PERIPHERY_VERSION}/periphery-${PERIPHERY_VERSION}.zip" \
            --output "$archive"
          # The SHA-256 of periphery-3.8.0.zip.
          printf '%s  %s\n' "07d4e286e31dd79164df39097e0b59f533c94badbe18158464a455ea88a166d7" "$archive" \
            | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP/periphery"
          printf '%s\n' "$RUNNER_TEMP/periphery" >> "$GITHUB_PATH"

      - name: Install pinned swift-dead-code
        run: |
          archive="$RUNNER_TEMP/swift-dead-code.zip"
          curl --fail --location --silent --show-error \
            "https://github.com/ivan-magda/swift-dead-code/releases/download/${SWIFT_DEAD_CODE_VERSION}/swift-dead-code-${SWIFT_DEAD_CODE_VERSION}-macos.zip" \
            --output "$archive"
          printf '%s  %s\n' "$SWIFT_DEAD_CODE_SHA256" "$archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP/swift-dead-code"
          printf '%s\n' "$RUNNER_TEMP/swift-dead-code" >> "$GITHUB_PATH"

      - name: Scan with and without tests
        run: swift-dead-code scan --output "$RUNNER_TEMP/scan"

      - name: Fail on findings missing from the baseline
        run: |
          scan="$RUNNER_TEMP/scan"
          status=0
          swift-dead-code baseline "$scan/all.json" "$scan/prod.json" \
            > "$scan/baseline.txt" 2>&1 || status=$?
          cat "$scan/baseline.txt"
          {
            echo '### Periphery findings missing from the baseline'
            echo '```'
            cat "$scan/baseline.txt"
            echo '```'
            echo 'The triage report is in the periphery artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload the triage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: periphery
          path: |
            ${{ runner.temp }}/scan/*.md
            ${{ runner.temp }}/scan/*.json
            ${{ runner.temp }}/scan/*.txt
            ${{ runner.temp }}/scan/*.log
            ${{ runner.temp }}/scan/*.err

  imports:
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned swift-dead-code
        run: |
          archive="$RUNNER_TEMP/swift-dead-code.zip"
          curl --fail --location --silent --show-error \
            "https://github.com/ivan-magda/swift-dead-code/releases/download/${SWIFT_DEAD_CODE_VERSION}/swift-dead-code-${SWIFT_DEAD_CODE_VERSION}-macos.zip" \
            --output "$archive"
          printf '%s  %s\n' "$SWIFT_DEAD_CODE_SHA256" "$archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP/swift-dead-code"
          printf '%s\n' "$RUNNER_TEMP/swift-dead-code" >> "$GITHUB_PATH"

      # Periphery never reports imports of package dependencies, pods, Testing or
      # Synchronization. Product code comes first; test code is left to an explicit
      # --include-tests run.
      - name: Try removing every dependency import from product code
        run: |
          work="$RUNNER_TEMP/prune"
          mkdir -p "$work"
          swift-dead-code prune-imports --work "$work" --all --modules deps --strict \
            | tee "$work/result.txt"
          status=${PIPESTATUS[0]}
          {
            echo '### Removable dependency imports in product code'
            echo '```'
            cat "$work/result.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" -ne 0 ]]; then
            echo "::error::Remove these imports: apply prune.patch from the imports artifact."
          fi
          exit "$status"

      - name: Upload the patch and build logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: imports
          path: |
            ${{ runner.temp }}/prune/prune.patch
            ${{ runner.temp }}/prune/result.txt
            ${{ runner.temp }}/prune/*.log
