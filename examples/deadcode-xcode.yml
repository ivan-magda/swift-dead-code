# An Xcode app with extensions, local packages and generated asset symbols.
project:
  kind: xcode
  path: MyApp.xcodeproj
  schemes: [MyApp]
  destination: "generic/platform=iOS Simulator"

# Generated by SwiftGen; it still counts as a user of what it references.
exclude: ["MyApp/Generated/**"]

allowlist:
  - asset: MyApp/Assets.xcassets/onboarding-*.imageset
    reason: OnboardingView loads "onboarding-\(step)" by computed name
  - file: scripts/launch_sim.sh
    reason: developer script run by hand

builds:
  - name: ios
    schemes: [MyApp]
    destination: "generic/platform=iOS Simulator"
  - name: watch
    schemes: [MyWatchApp]
    destination: "generic/platform=watchOS Simulator"
